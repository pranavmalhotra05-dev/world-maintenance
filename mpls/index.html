<meta charset="utf-8">
<title>Roofprint 3D · Minneapolis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/deck.gl@9.1.14/dist.min.js"></script>
<style>
/* Layout: full-screen 3D scene; control column on the left, house dossier on the right. Single dark theme on purpose: laser points read best on black. */
:root {
  --void: #05070b; --glass: rgba(9, 13, 20, .86); --edge: rgba(120, 190, 255, .22);
  --ink: #e2ebf5; --dim: #8b9bb0; --cyan: #4fdcff; --amber: #ffb84d; --red: #ff5a5a; --green: #6cdc8c;
  --f-display: "Chakra Petch", "Bahnschrift", sans-serif; --f-body: "IBM Plex Sans", "Segoe UI", sans-serif; --f-mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); font: 14px/1.5 var(--f-body); }
#deck { position: fixed; inset: 0; }
.panel { position: fixed; z-index: 2; background: var(--glass); border: 1px solid var(--edge); border-radius: 6px; backdrop-filter: blur(8px); padding: 12px 14px; overflow-y: auto; }
.ctl { top: max(12px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); width: 330px; max-width: calc(100% - 24px); max-height: calc(100% - 24px); display: flex; flex-direction: column; gap: 10px; }
.lbl { font: 500 10.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
h1 { margin: 0; font: 700 24px/1.05 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
h1 b { color: var(--cyan); }
h4 { margin: 10px 0 4px; font: 600 12px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); }
.sub { font-size: 12.5px; color: var(--dim); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.stats .v { display: block; font: 600 18px/1.1 var(--f-display); }
.stats .l { font-size: 11px; color: var(--dim); line-height: 1.25; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--edge); }
.seg button { background: none; border: 0; color: var(--dim); padding: 5px 9px; cursor: pointer; font: 600 11px var(--f-display); letter-spacing: .07em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: rgba(79,220,255,.14); color: var(--cyan); box-shadow: inset 0 -2px 0 var(--cyan); }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 12.5px; }
.toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
input[type=checkbox], input[type=range] { accent-color: var(--cyan); }
select { background: rgba(0,0,0,.4); color: var(--ink); border: 1px solid var(--edge); border-radius: 3px; padding: 3px 6px; font: 12px var(--f-mono); }
.legend { font: 11px var(--f-mono); color: var(--dim); display: flex; flex-direction: column; gap: 3px; }
.legend .ramp { height: 6px; border-radius: 3px; }
.legend .ticks { display: flex; justify-content: space-between; }
.card { right: max(12px, env(safe-area-inset-right, 0px)); top: max(12px, env(safe-area-inset-top, 0px)); width: 360px; max-width: calc(100% - 24px); max-height: calc(100% - 24px); }
.card h3 { margin: 2px 0 2px; font: 700 21px/1.15 var(--f-display); padding-right: 22px; }
.card .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: var(--dim); font-size: 20px; cursor: pointer; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-size: 12.5px; }
dt { color: var(--dim); } dd { margin: 0; font-family: var(--f-mono); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.chip { font: 11px var(--f-mono); padding: 1px 7px; border-radius: 99px; border: 1px solid var(--edge); }
.chip.warn { border-color: var(--amber); color: var(--amber); } .chip.bad { border-color: var(--red); color: var(--red); } .chip.ok { border-color: var(--green); color: var(--green); }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.thumbs figure { margin: 0; } .thumbs canvas { width: 100%; aspect-ratio: 1; border-radius: 3px; display: block; background: #111; }
.thumbs figcaption { font: 10.5px var(--f-mono); color: var(--dim); text-align: center; }
ul.log { list-style: none; margin: 0; padding: 0; font-size: 12px; }
ul.log li { padding: 3px 0; border-bottom: 1px solid rgba(120,190,255,.08); }
ul.log b { font-family: var(--f-mono); font-weight: 500; color: var(--dim); margin-right: 6px; }
.src { font-size: 11.5px; color: var(--dim); }
.src li { margin: 2px 0; }
.boot { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--void); font: 13px var(--f-mono); letter-spacing: .2em; color: var(--cyan); text-align: center; }
:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
.feeds details { border-top: 1px solid var(--edge); padding: 4px 0; }
.feeds summary { cursor: pointer; font-size: 12.5px; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.feeds summary::-webkit-details-marker { display: none; }
.feeds .fr { font: 10.5px var(--f-mono); color: var(--dim); }
.feeds .ok { color: var(--green); } .feeds .no { color: var(--red); }
.feeds .body { font-size: 12px; color: var(--ink); padding: 4px 0 2px; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { background: rgba(79,220,255,.12); border: 1px solid var(--cyan); color: var(--cyan); padding: 6px 10px; cursor: pointer; font: 600 11.5px var(--f-display); letter-spacing: .08em; text-transform: uppercase; border-radius: 3px; }
.btn[aria-pressed="true"] { background: var(--cyan); color: #001018; }
table.pay { width: 100%; border-collapse: collapse; font: 12px var(--f-mono); margin-top: 4px; }
table.pay td, table.pay th { padding: 3px 4px; border-bottom: 1px solid rgba(120,190,255,.1); text-align: right; }
table.pay th { color: var(--dim); font-weight: 500; } table.pay td:first-child, table.pay th:first-child { text-align: left; }
.bigv { font: 700 22px var(--f-display); color: var(--amber); }
.sky { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--edge); padding-top: 8px; }
.skyrow { display: flex; gap: 6px; align-items: center; }
.skyrow input[type=date] { background: rgba(0,0,0,.4); color: var(--ink); border: 1px solid var(--edge); border-radius: 3px; padding: 4px 6px; font: 12px var(--f-mono); }
.skygrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 12px; }
.skygrid .v { display: block; font: 600 15px var(--f-display); color: var(--ink); }
.skygrid .l { color: var(--dim); font-size: 11px; }
@media (max-width: 760px) { .card { top: auto; bottom: 12px; left: 12px; width: auto; max-height: 55%; } .ctl { right: 12px; width: auto; max-height: 40%; } }
</style>

<div id="deck"></div>
<div class="panel ctl">
  <div><div class="lbl">Standish · south Minneapolis</div><h1>Roofprint <b>3D</b></h1>
    <div class="sub">Every laser point, every open record, per house</div></div>
  <div class="stats" id="stats"></div>
  <div><div class="lbl" style="margin-bottom:4px">Points coloured by</div>
    <div class="seg" id="colorSeg" role="group" aria-label="Point colour">
      <button data-c="class" aria-pressed="true">What it hit</button><button data-c="height" aria-pressed="false">Height</button>
      <button data-c="dev" aria-pressed="false">Roof deviation</button><button data-c="photo" aria-pressed="false">Photo</button><button data-c="intensity" aria-pressed="false">Intensity</button>
    </div></div>
  <div class="legend" id="legend"></div>
  <div class="toggles">
    <label><input type="checkbox" id="t-ground" checked> Ground points</label>
    <label><input type="checkbox" id="t-house" checked> House points</label>
    <label><input type="checkbox" id="t-veg" checked> Tree points</label>
    <label><input type="checkbox" id="t-other" checked> Other points</label>
    <label><input type="checkbox" id="t-model"> Roof models</label>
    <label><input type="checkbox" id="t-photo"> Photo surface</label>
    <label><input type="checkbox" id="t-streets" checked> Street condition</label>
    <label><input type="checkbox" id="t-curbs" checked> Curbs &amp; walks</label>
    <label><input type="checkbox" id="t-311"> 311 cases</label>
    <label><input type="checkbox" id="t-permits" checked> Roof permits</label>
    <label><input type="checkbox" id="t-crime"> Crime (12 mo)</label>
    <label><input type="checkbox" id="t-signals" checked> Signals &amp; speed</label>
    <label><input type="checkbox" id="t-snow"> Snow zones</label>
    <label><input type="checkbox" id="t-traffic"> Traffic volume</label>
    <label><input type="checkbox" id="t-util" checked> Utilities</label>
    <label><input type="checkbox" id="t-trans"> Rail &amp; transit</label>
    <label><input type="checkbox" id="t-fac"> Schools &amp; services</label>
    <label><input type="checkbox" id="t-osm" checked> Street furniture (OSM)</label>
  </div>
  <label class="sub" style="display:flex;gap:8px;align-items:center">Photo year <select id="year"></select>
    <span style="margin-left:auto">Dot</span><input type="range" id="t-size" min="0.6" max="3" step="0.2" value="1.2" style="width:80px"></label>
  <div class="btnrow"><button class="btn" id="tour" aria-pressed="false">Tour the block</button><button class="btn" id="orbitBtn" aria-pressed="true">Orbit selected</button>
    <label class="sub" style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="t-trees"> Tree IDs</label></div>
  <div class="sky" id="skyPanel">
    <div class="lbl">Sky over the block · Minneapolis time (CT)</div>
    <div class="skyrow"><input type="date" id="skyDate" aria-label="Date"><button class="btn" id="skyNow">Now</button><button class="btn" id="skyPlay" aria-pressed="false">Play day</button></div>
    <input type="range" id="skyTime" min="0" max="1439" step="5" aria-label="Time of day" style="width:100%">
    <div class="skygrid" id="skyOut"></div>
    <label class="sub" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="t-shadow"> Light &amp; shadow at this moment (ray-traced)</label>
  </div>
  <div class="feeds" id="feeds"><div class="lbl">Live and recent feeds</div></div>
  <div><div class="lbl">Sources in this view</div><ul class="src" id="sources" style="margin:4px 0 0;padding-left:16px"></ul></div>
</div>
<div class="panel card" id="card" hidden></div>
<div class="boot" id="boot">STREAMING 2.4 MILLION LASER POINTS<br>AND EVERY OPEN RECORD…</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat("en-US");
const b64 = (s, T) => { const bin = Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); return new T(bin.buffer); };
const RAMP = [[0, [40, 60, 200]], [0.2, [30, 170, 240]], [0.4, [40, 230, 150]], [0.6, [200, 240, 60]], [0.8, [255, 165, 40]], [1, [230, 50, 30]]];

const devColor = (m) => { const t = Math.max(-1, Math.min(1, m / 0.25)); return t < 0 ? [255 + 215 * t, 255 + 135 * t, 255] : [255, 255 - 200 * t, 255 - 220 * t]; };
const state = { util: true, trans: false, fac: false, osm: true, crime: false, signals: true, snow: false, traffic: false, orbit: true, tour: false, treesOn: false, color: "class", ground: true, house: true, veg: true, other: true, model: false, photo: false, streets: true, curbs: true, c311: false, permits: true, size: 1.2, year: 2026, sel: null };
let X = null, INF = null, SKY = { t: new Date(), play: false, shadow: false, lit: null, sun: null, moon: null }, DSMg = null, C = null, T = [], F = null, MK = null, spinT = 0, tourT = 0, selPts = null, M, H, L, deckgl, houseMesh, terrainMesh, P, imgs = {}, view, cache = {};

async function boot() {
  const get = (f) => fetch("data/" + f).then((r) => r.json());
  const [meta, houses, layers, sources, mesh] = await Promise.all([get("meta.json"), get("houses.json"), get("layers.json"), get("sources.json"), get("mesh.txt")]);
  M = meta; H = houses; L = layers;
  const opt = (f) => fetch("data/" + f).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  [T, F, MK, C, X, INF] = await Promise.all([opt("trees.json").then((x) => x || []), opt("feeds.json"), opt("market.json"), opt("civic.json"), opt("extras.json"), opt("infra.json")]);
  for (const y of L.img_years) imgs[y] = await new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = `data/img/${y}.jpg`; });
  state.year = L.img_years[L.img_years.length - 1];
  $("year").innerHTML = L.img_years.map((y) => `<option ${y === state.year ? "selected" : ""}>${y}</option>`).join("");
  houseMesh = { P: b64(mesh.houses.pos, Float32Array), N: b64(mesh.houses.nrm, Float32Array), C: b64(mesh.houses.col, Uint8Array), I: b64(mesh.houses.idx, Uint32Array) };
  const t = mesh.terrain;
  terrainMesh = { attributes: { POSITION: { value: b64(t.pos, Float32Array), size: 3 }, NORMAL: { value: b64(t.nrm, Float32Array), size: 3 }, TEXCOORD_0: { value: b64(t.uv, Float32Array), size: 2 } }, indices: { value: b64(t.idx, Uint32Array), size: 1 } };
  const txt = await Promise.all([...Array(meta.point_parts).keys()].map((i) => fetch(`data/points_${i}.txt`).then((r) => r.text())));
  P = decodePoints(txt, meta.point_unit_m || 0.02); gz = groundGrid();
  const rp = H.filter((h) => h.roof_permit).length, cc = H.filter((h) => h.roof_color_change).length;
  $("stats").innerHTML = [[fmt.format(P.n), "laser points, all shown"], [meta.points_per_m2 + "/m²", "USGS 2022 scan"],
    [fmt.format(H.filter((h) => !h.garage).length), "houses + " + H.filter((h) => h.garage).length + " garages"], [fmt.format(rp), "roofs with a re-roof permit"],
    [fmt.format(cc), "roofs whose colour changed in photos"], [L.hail_days.length + " days", "radar hail ≥0.5 in over the block since 2020"]]
    .map(([v, l]) => `<div><span class="v">${v}</span><span class="l">${l}</span></div>`).join("");
  $("sources").innerHTML = sources.map((s) => `<li><b style="color:var(--ink);font-weight:500">${s.name}</b> · ${s.detail}</li>`).join("");
  view = { longitude: M.origin[0] + 0.0002, latitude: M.origin[1] - 0.0009, zoom: 18.0, pitch: 60, bearing: -32, maxPitch: 85, maxZoom: 22, minZoom: 15 };
  deckgl = new deck.Deck({ parent: $("deck"), controller: true, initialViewState: view, onViewStateChange: ({ viewState, interactionState }) => { view = viewState; if (interactionState?.isDragging) spinT = performance.now() + 4000; }, getTooltip: tip });
  legend(); render(); feedsPanel(); initSky(); $("boot").hidden = true; requestAnimationFrame(tick);
}

function decodePoints(txts, unit) {
  let n = 0; const bins = txts.map((t) => { const b = Uint8Array.from(atob(t), (c) => c.charCodeAt(0)); n += b.length / 10; return b; });
  const pos = new Float32Array(n * 3), kind = new Uint8Array(n), hag = new Float32Array(n), dev = new Float32Array(n), inten = new Uint8Array(n); let i = 0;
  for (const b of bins) { const dv = new DataView(b.buffer); for (let o = 0; o < b.length; o += 10, i++) {
    pos[i * 3] = dv.getInt16(o, true) * unit; pos[i * 3 + 1] = dv.getInt16(o + 2, true) * unit; pos[i * 3 + 2] = dv.getUint16(o + 4, true) / 100;
    kind[i] = dv.getUint8(o + 6); hag[i] = dv.getUint8(o + 7) / 8; dev[i] = dv.getInt8(o + 8) * unit; inten[i] = dv.getUint8(o + 9); } }
  return { n, pos, kind, hag, dev, inten };
}
function groundGrid() {
  const half = M.half_m, cs = 2, n = Math.ceil((2 * half) / cs), sum = new Float64Array(n * n), cnt = new Uint32Array(n * n);
  for (let i = 0; i < P.n; i++) if (P.kind[i] === 0) { const c = Math.min(n - 1, Math.max(0, Math.floor((P.pos[i * 3] + half) / cs))), r = Math.min(n - 1, Math.max(0, Math.floor((P.pos[i * 3 + 1] + half) / cs))); sum[r * n + c] += P.pos[i * 3 + 2]; cnt[r * n + c]++; }
  const g = new Float32Array(n * n); let last = 0; for (let i = 0; i < n * n; i++) { if (cnt[i]) last = sum[i] / cnt[i]; g[i] = cnt[i] ? sum[i] / cnt[i] : last; }
  return (x, y) => g[Math.min(n - 1, Math.max(0, Math.floor((y + half) / cs))) * n + Math.min(n - 1, Math.max(0, Math.floor((x + half) / cs)))];
}
let gz = null;
function photoSampler(year) {
  const im = imgs[year]; if (!im) return null;
  if (cache["px" + year]) return cache["px" + year];
  const cv = document.createElement("canvas"); cv.width = im.width; cv.height = im.height; const cx = cv.getContext("2d"); cx.drawImage(im, 0, 0);
  const d = cx.getImageData(0, 0, cv.width, cv.height).data, w = cv.width, h = cv.height, half = M.half_m;
  return (cache["px" + year] = (x, y) => { const u = Math.min(w - 1, Math.max(0, Math.floor((x + half) / (2 * half) * w))), v = Math.min(h - 1, Math.max(0, Math.floor((half - y) / (2 * half) * h))); const o = (v * w + u) * 4; return [d[o], d[o + 1], d[o + 2]]; });
}
function pointColor(i, mode, ph) {
  const k = P.kind[i], it = P.inten[i] / 255;
  if (mode === "photo" && ph) return ph(P.pos[i * 3], P.pos[i * 3 + 1]);
  if (mode === "shadow") { const L = SKY.lit ? SKY.lit[i] : 0; if (k === 2) return L ? [150, 230, 120] : [20, 60, 40]; return L ? [255, 214, 120] : [30, 45, 95]; }
  if (mode === "intensity") { const v = 20 + it * 235; return [v, v, v]; }
  if (mode === "height") return k === 0 ? [30 + 60 * it, 50 + 70 * it, 110 + 80 * it] : ramp(0.15 + P.hag[i] / 14);
  if (mode === "dev") return k === 1 ? devColor(P.dev[i]) : k === 0 ? [28 + 40 * it, 32 + 40 * it, 40 + 40 * it] : [40, 60, 50];
  // "what it hit": ground shaded by laser intensity (asphalt dark, concrete walks bright, grass mid), houses warm, trees green
  if (k === 0) return [40 + 150 * it, 48 + 150 * it, 60 + 140 * it];
  if (k === 1) { const t = Math.min(P.hag[i] / 10, 1); return [235, 120 + 90 * t, 70 + 40 * t]; }
  if (k === 2) { const t = Math.min(P.hag[i] / 18, 1); return [50 + 40 * t, 150 + 80 * t, 80]; }
  return [170, 150, 230];
}
function pointLayer(kindWanted, id) {
  const key = `${id}|${state.color}|${state.year}`;  // shadow keys hold '|shadow|' and are dropped when the moment changes
  if (!cache[key]) {
    const idx = []; for (let i = 0; i < P.n; i++) if (P.kind[i] === kindWanted) idx.push(i);
    const pos = new Float32Array(idx.length * 3), col = new Uint8Array(idx.length * 3), ph = state.color === "photo" ? photoSampler(state.year) : null;
    idx.forEach((i, j) => { pos.set(P.pos.subarray(i * 3, i * 3 + 3), j * 3); const c = pointColor(i, state.color, ph); col[j * 3] = c[0]; col[j * 3 + 1] = c[1]; col[j * 3 + 2] = c[2]; });

  }

}
const pciColor = (p) => p == null ? [150, 150, 150] : p >= 80 ? [108, 220, 140] : p >= 60 ? [255, 210, 80] : p >= 40 ? [255, 150, 60] : [255, 80, 80];
function render() {
  const O = [M.origin[0], M.origin[1], 0], CS = deck.COORDINATE_SYSTEM.METER_OFFSETS, ly = [];
  const clip = new deck.ClipExtension(), cb = [-M.half_m, -M.half_m, M.half_m, M.half_m];

  if (state.photo && imgs[state.year]) ly.push(new deck.SimpleMeshLayer({ id: "terrain" + state.year, data: [0], mesh: terrainMesh, texture: imgs[state.year], getPosition: [0, 0, -0.15], coordinateSystem: CS, coordinateOrigin: O, material: { ambient: 0.8, diffuse: 0.3 }, getColor: [255, 255, 255] }));
  if (state.ground) ly.push(pointLayer(0, "pg"));
  if (state.house) ly.push(pointLayer(1, "ph"));
  if (state.veg) ly.push(pointLayer(2, "pv"));
  if (state.other) ly.push(pointLayer(3, "po"));

    if (!cache.meshCol) { const c = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const w = C[i * 4 + 2] === 2; const v = w ? [0.86, 0.84, 0.8] : [0.48, 0.45, 0.43]; c.set(v, i * 3); } cache.meshCol = c; }
    ly.push(new deck.SimpleMeshLayer({ id: "models", data: [0], coordinateSystem: CS, coordinateOrigin: O, getPosition: [0, 0, 0], getColor: [255, 255, 255, 150], opacity: 0.55,
      mesh: { attributes: { POSITION: { value: Pp, size: 3 }, NORMAL: { value: N, size: 3 }, COLOR_0: { value: cache.meshCol, size: 3 } }, indices: { value: I, size: 1 } }, material: { ambient: 0.45, diffuse: 0.7 } }));

    if (f.name.startsWith("Station")) return `${esc(d.latest?.t)}: ${esc(d.latest?.text)}, ${d.latest?.temp_c != null ? Math.round(d.latest.temp_c) + "°C" : "–"}; max gust 7 days ${d.max_gust_kmh ? Math.round(d.max_gust_kmh) + " km/h" : "–"}; rain ${d.rain_mm_7d} mm`;
    if (f.name.startsWith("Flood insurance")) return `${d.claims} flood-insurance claims in ZIP 55407, ${money0(d.paid_building_usd)} paid on buildings`;
    return "ok"; };
  const xs = X ? [
    ["Active fires within 300 km (NASA FIRMS, ~3 h)", X.fires, (d) => `${d.length} detections in 24 h${d[0] ? `; nearest ${d[0].km} km` : ""}`],
        ["Mortgage originations in this tract (CFPB HMDA, yearly)", X.hmda, (d) => Object.entries(d.originations).map(([y, v]) => `${y}: ${v.loans} loans`).join(" · ")],
    ["Walkability (EPA Smart Location, static)", X.walkability, (d) => `walk index ${d.NatWalkInd?.toFixed?.(1) ?? d.NatWalkInd}/20 · transit ${d.D4A > 0 ? Math.round(d.D4A) + " m" : "–"} · ${d.Pct_AO0 != null ? Math.round(d.Pct_AO0 * 100) + "% households without a car" : ""}`],
    ["Jobs in this tract (Census LODES, yearly)", X.jobs_lodes, (d) => `${fmt.format(d.jobs_in_tract)} jobs (${d.year})`],
    ["Lawn and vegetation (NAIP near-infrared)", X.naip_lawn, (d) => `${esc(d.date)} at ${d.gsd_m} m · block NDVI ${d.block_ndvi}`],
    ["Tree canopy height (Meta/WRI 1 m)", X.canopy_height, (d) => `block canopy cover ${d.block_cover_pct}% · mean ${d.block_mean_m} m`],
    ["Home price index, ZIP 55407 (FHFA, yearly)", X.fhfa_hpi, (d) => `${d.series?.slice(-1)[0]?.join(": ")} · ${d.change_10y_pct > 0 ? "+" : ""}${d.change_10y_pct}% in 10 years`],
    ["Satellite view now (NOAA GOES-19)", X.goes, (d) => `<img src="data/${esc(d.file || "goes.jpg")}" alt="Latest GOES-19 image of the upper Midwest" style="width:100%;border-radius:4px;margin-top:4px">`],
    ["Transportation noise (US DOT BTS)", X.noise, (d) => `${d.db_laeq_24h ?? "–"} dB (24-h average)`],
  ].map(([n, e, f]) => ({ n, ok: !!e?.data, body: e?.data ? f(e.data) : esc(X.status?.[Object.keys(X).find((k) => X[k] === e)] || "not available"), up: e?.updates || "", lic: e?.licence || "" })) : [];
  $("feeds").innerHTML = `<div class="lbl">Live and recent feeds · snapshot ${esc(F.generated.replace("T", " "))} UTC</div>` + F.feeds.map((f) =>
    `<details><summary><span>${esc(f.name)}</span><span class="fr ${f.ok ? "ok" : "no"}">${f.ok ? "●" : "○"} ${esc(f.updates)}</span></summary><div class="body">${sum(f)}<div class="fr">${esc(f.provider)}</div></div></details>`).join("") + xs.map((x) =>
    `<details><summary><span>${esc(x.n)}</span><span class="fr ${x.ok ? "ok" : "no"}">${x.ok ? "●" : "○"}</span></summary><div class="body">${x.body}<div class="fr">${esc(x.lic)}</div></div></details>`).join("");
}
$("colorSeg").onclick = (e) => { const c = e.target.dataset?.c; if (!c) return; state.color = c; document.querySelectorAll("#colorSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.c === c)); legend(); render(); };
for (const [id, k] of [["t-ground", "ground"], ["t-house", "house"], ["t-veg", "veg"], ["t-other", "other"], ["t-model", "model"], ["t-photo", "photo"], ["t-streets", "streets"], ["t-curbs", "curbs"], ["t-311", "c311"], ["t-permits", "permits"]]) $(id).onchange = (e) => { state[k] = e.target.checked; render(); };
$("t-size").oninput = (e) => { state.size = +e.target.value; render(); };
$("t-trees").onchange = (e) => { state.treesOn = e.target.checked; render(); };
for (const [id, k] of [["t-crime", "crime"], ["t-signals", "signals"], ["t-snow", "snow"], ["t-traffic", "traffic"], ["t-util", "util"], ["t-trans", "trans"], ["t-fac", "fac"], ["t-osm", "osm"]]) $(id).onchange = (e) => { state[k] = e.target.checked; render(); };
$("orbitBtn").onclick = () => { state.orbit = !state.orbit; $("orbitBtn").setAttribute("aria-pressed", state.orbit); };
$("tour").onclick = () => {
  state.tour = !state.tour; $("tour").setAttribute("aria-pressed", state.tour); clearInterval(tourT);
  if (!state.tour) return;
  const score = (h) => (h.roof_color_change ? 2 : 0) + (h.roof_permit ? 1 : 0) + ((h.roof_dev?.spread_cm || 0) > 12.8 ? 2 : 0) + ((h.sun?.solar_kw || 0) >= 3 ? 1 : 0) + (h.ash_nearby ? 1 : 0) + (h.stories_check?.agrees === false ? 1 : 0);
  const list = H.filter((h) => !h.garage).sort((a, b) => score(b) - score(a)).slice(0, 12); let i = 0;
  const step = () => { select(list[i % list.length], true); i++; }; step(); tourT = setInterval(step, 9000);
};
$("year").onchange = (e) => { state.year = +e.target.value; legend(); render(); };
boot().catch((e) => { $("boot").textContent = "FAILED: " + e.message; console.error(e); });
</script>
