<!doctype html>
<!-- Old Open Property Intelligence Catalog page: the catalog is now a panel inside the globe app (?panel=catalog).
     The World Maintenance globe app (app/index.html) replaced this page. The original lives in archive/legacy-pages/catalog.html.
     URL scheme: app/index.html?lat=&lon=&z=&pitch=&bearing=&block=<slug>&house=<id>&area=county:<fips>|place:<geoid>&panel=catalog -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Maintenance</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="1; url=../app/index.html?panel=catalog">
<link rel="canonical" href="../app/index.html?panel=catalog">
<script>
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  out.set("panel", "catalog");
  var th = q.get("theme"); if (th && /^[\w-]+$/.test(th)) out.set("theme", th);
  location.replace("../app/index.html?" + out.toString());
})();
</script>
<style>body { background: #05070b; color: #cfd8e3; font: 15px system-ui, sans-serif; margin: 0; padding: 40px 16px; } a { color: #7fd4ff; }</style>
<noscript><p>The data catalog moved into the World Maintenance globe. <a href="../app/index.html?panel=catalog">Open the catalog</a>.</p></noscript>
