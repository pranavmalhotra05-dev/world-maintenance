<style>
/* Dot globe: every dot is a real ETOPO 2022 sample (land denser than ocean, the US much denser). No sphere fill by default:
   space, the real IAU stars at their true positions for the chosen time, and the dots. NASA Blue/Black Marble is an optional skin.
   Colours and fonts come from theme.js (--void --glass --edge --ink --dim --cyan --amber --red --green --magenta --lime --f-*). */
:root { color-scheme: dark; --sel: #ffd24d; --pin: #4fdcff; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--void); color: var(--ink); height: 100%; }
body { margin: 0; font: 14px/1.5 var(--f-body); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }

.stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
#sky, #globe { position: absolute; inset: 0; }
#sky { width: 100%; height: 100%; }
.panel { position: absolute; background: var(--glass); border: 1px solid var(--edge); border-radius: 4px; backdrop-filter: blur(8px);
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 24px color-mix(in srgb, var(--cyan) 6%, transparent) inset; z-index: 2; }
.panel::before, .panel::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1px solid var(--cyan); opacity: .7; pointer-events: none; }
.panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

.title { top: max(14px, env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); padding: 12px 16px; width: 340px; max-width: calc(100% - 28px); max-height: calc(100% - 28px); overflow-y: auto; }
.title h1 { margin: 0; font: 700 25px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.title h1 b { color: var(--cyan); font-weight: 700; }
.title .sub { margin-top: 6px; font-size: 12.5px; color: var(--dim); }
.nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.nav a { font: 11px var(--f-mono); letter-spacing: .08em; color: var(--cyan); text-decoration: none; border: 1px solid var(--edge); padding: 2px 7px; border-radius: 2px; }
.nav a[aria-current="page"] { color: var(--ink); border-color: var(--cyan); }
.nav a:hover { background: color-mix(in srgb, var(--cyan) 12%, transparent); }
.live { color: var(--lime); font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; }
.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); margin-right: 6px; box-shadow: 0 0 8px var(--lime); animation: blink 2s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.ctl { display: flex; flex-direction: column; gap: 3px; margin-top: 9px; }
.ctl select, .ctl input[type=search], .ctl input[type=date] { background: rgba(0,0,0,.4); border: 1px solid var(--edge); border-radius: 2px; padding: 5px 8px; width: 100%; font-family: var(--f-mono); font-size: 12.5px; }
.ctl select option, .ctl select optgroup { background: var(--void); }
.ctl.theme-pick { flex-direction: row; } .ctl.theme-pick .lbl { flex: none; }
.tg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; margin-top: 9px; font-size: 12.5px; }
.tg label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.time { display: grid; grid-template-columns: 1fr auto; gap: 4px 6px; align-items: center; }
.time input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--cyan); }
.time .t { font: 11.5px var(--f-mono); color: var(--amber); grid-column: 1 / -1; }
.chip { background: none; border: 1px solid var(--edge); color: var(--dim); font: 11px var(--f-mono); padding: 2px 8px; cursor: pointer; border-radius: 2px; }
.chip:hover { color: var(--ink); border-color: var(--cyan); }
.srch { position: relative; }
.ctl.lidar { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.ctl.lidar a { text-decoration: none; color: var(--cyan); border-color: var(--cyan); }
.ctl.lidar small { color: var(--dim); font-size: 11px; }
.results { position: absolute; left: 0; right: 0; top: 100%; margin: 2px 0 0; padding: 0; list-style: none; background: var(--void); border: 1px solid var(--edge); max-height: 280px; overflow-y: auto; z-index: 4; }
.results button { width: 100%; text-align: left; border: 0; background: none; padding: 6px 9px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.results button:hover, .results button.on { background: color-mix(in srgb, var(--cyan) 12%, transparent); }
.results small { color: var(--dim); font-family: var(--f-mono); font-size: 11px; }
.legend { margin-top: 10px; font: 11px var(--f-mono); color: var(--dim); }
.legend .ramp { display: flex; height: 8px; margin: 4px 0 3px; box-shadow: 0 0 10px color-mix(in srgb, var(--cyan) 25%, transparent); }
.legend .ramp i { flex: 1; }
.legend .ticks { display: flex; justify-content: space-between; }
.legend .nd { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.legend .nd i { width: 10px; height: 10px; border: 1px solid var(--edge); }
.legend .note { margin-top: 4px; font-family: var(--f-body); font-size: 11.5px; line-height: 1.35; }
html[data-skin="neon80s"] .legend .lt { font: 400 13px var(--f-display); letter-spacing: .08em; text-transform: none; color: var(--magenta); text-shadow: 0 0 6px var(--magenta), 0 0 16px var(--magenta); }

.card { right: max(14px, env(safe-area-inset-right, 0px)); top: max(14px, env(safe-area-inset-top, 0px)); width: 360px; max-width: calc(100% - 28px); padding: 12px 14px; max-height: calc(100% - 60px); overflow-y: auto; }
.card h3 { margin: 2px 0 0; font: 700 21px/1.15 var(--f-display); letter-spacing: .02em; padding-right: 24px; }
.card .x { position: absolute; top: 4px; right: 6px; background: none; border: 0; color: var(--dim); font-size: 20px; cursor: pointer; }
.card .rk { margin-top: 4px; font: 600 13px var(--f-mono); color: var(--amber); }
.card .rk span { color: var(--dim); font-weight: 400; }
.card h4 { margin: 12px 0 2px; font: 600 11px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); border-bottom: 1px solid var(--edge); padding-bottom: 2px; }
.card .caveat { margin-top: 4px; font-size: 11.5px; line-height: 1.35; color: var(--dim); }
.card ul.hol { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12px; }
.card ul.hol li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid color-mix(in srgb, var(--edge) 40%, transparent); padding: 1px 0; }
.card ul.hol li span:last-child { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); }
dl.kv { display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; margin: 4px 0 0; font-size: 12.5px; }
dl.kv dt { color: var(--dim); } dl.kv dd { margin: 0; font-family: var(--f-mono); font-size: 12px; text-align: right; }
.badge { display: inline-block; margin-top: 8px; padding: 3px 8px; border: 1px solid var(--magenta); color: var(--magenta); font: 600 11px var(--f-mono); letter-spacing: .08em; border-radius: 2px; text-decoration: none; }
a.badge:hover { background: color-mix(in srgb, var(--magenta) 12%, transparent); }
.badge.off { border-color: var(--edge); color: var(--dim); }
.card .fileno { display: inline-block; margin-bottom: 4px; padding: 1px 8px; border: 1px solid var(--red); color: var(--red); font: 400 13px var(--f-display); letter-spacing: .18em; transform: rotate(-1.5deg); }
html[data-skin="intel"] .redact { cursor: pointer; user-select: none; }
.foot { position: absolute; z-index: 2; left: 370px; right: 390px; bottom: 6px; font: 10.5px var(--f-mono); color: var(--dim); text-align: center; pointer-events: none; text-shadow: 0 0 4px #000; }
.hint { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); bottom: 26px; padding: 5px 12px; font: 12px var(--f-mono); color: var(--ink); white-space: nowrap; pointer-events: none; }
.hint b { color: var(--amber); font-weight: 500; }
.boot { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; font: 13px var(--f-mono); color: var(--cyan); letter-spacing: .2em; background: #000; text-align: center; padding: 16px; }
.deck-tooltip { font: 12px var(--f-body) !important; background: var(--glass) !important; backdrop-filter: blur(6px); border: 1px solid var(--edge); border-radius: 3px; color: var(--ink) !important; padding: 7px 9px !important; max-width: 300px; }
@media (max-width: 1100px) { .foot { display: none; } }
@media (max-width: 760px) {
  .title { width: auto; right: 16px; left: 16px; max-height: 46vh; padding: 10px 12px; }
  .title h1 { font-size: 20px; }
  .card { left: 16px; right: 16px; top: auto; bottom: 16px; width: auto; max-height: 42vh; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
</style>

<script>
// ===================== copied from index.html (metrics, optional inputs, helpers) =====================
const METRICS = [
  { k: "overlap", label: "Overlap score", unit: "/100", fmt: v => v.toFixed(1), note: "How many free data layers stack up: LiDAR recency, density, re-flights, hail 2015–24, homes. Geometric mean, 0–100." },
  { k: "lidar_density", label: "LiDAR density", unit: " pts/m²", fmt: v => v.toFixed(1), note: "Laser points per m² in the newest USGS 3DEP project covering ≥30% of the county." },
  { k: "lidar_year", label: "LiDAR newest year", unit: "", fmt: v => String(v), note: "Year of the newest USGS 3DEP LiDAR flight covering ≥30% of the county." },
  { k: "hail24", label: "Hail reports · 24 mo", unit: "", fmt: v => v.toLocaleString(), note: "NOAA SPC hail reports (all sizes) in the last 24 months." },
  { k: "hail24_max", label: "Max hail size · 24 mo", unit: " in", fmt: v => v.toFixed(2), note: "Largest hailstone reported to NOAA SPC in the last 24 months." },
  { k: "wind24", label: "Wind reports · 24 mo", unit: "", fmt: v => v.toLocaleString(), note: "NOAA SPC damaging-wind reports in the last 24 months." },
  { k: "torn24", label: "Tornado reports · 24 mo", unit: "", fmt: v => v.toLocaleString(), note: "NOAA SPC tornado reports in the last 24 months." },
  { k: "nri_hail", label: "FEMA NRI hail risk", unit: "", fmt: v => v.toFixed(1), note: "FEMA National Risk Index hail risk score (0–100, national percentile)." },
  { k: "nri_risk", label: "FEMA NRI overall risk", unit: "", fmt: v => v.toFixed(1), note: "FEMA National Risk Index composite risk score, all 18 hazards (0–100)." },
  { k: "home_value", label: "Median home value", unit: "", fmt: v => "$" + Math.round(v / 1000).toLocaleString() + "k", note: "Census ACS 2020–24 5-year, B25077 owner-occupied median value." },
  { k: "year_built", label: "Median year built", unit: "", fmt: v => String(v), note: "Census ACS 2020–24 5-year, B25035 median year structure built." },
  { k: "oz18_share", label: "Opportunity Zones · 2018 round", unit: "", fmt: v => (v * 100).toFixed(1) + "% of tracts", note: "Share of the county's census tracts designated Qualified Opportunity Zones (IRS Notice 2018-48 / 2019-42; in force to 2028-12-31). Treasury · CDFI Fund, public domain." },
  { k: "oz27_share", label: "Opportunity Zones · 2027 round", unit: "", fmt: v => (v * 100).toFixed(1) + "% of tracts", note: "Share of tracts in the new round announced 2026-11-05 (Rev. Proc. 2026-14), effective 2027-01-01 to 2036-12-31. Treasury · CDFI Fund, public domain." },
  { k: "sf_detached", label: "Single-family homes", unit: "", fmt: v => v.toLocaleString(), note: "Detached single-family homes, Census ACS 2019–23 B25024." },
];
// 8 equal-count bands; colours come from the active theme's ramp (theme.js)
const NBANDS = 8;
const T = window.Themes;
const skin = () => T.current().id;
const bandColor = i => T.ramp(i / (NBANDS - 1)).slice(0, 3);
const NODATA_A = 46;   // no-data counties: theme 'other' at low alpha
const css = c => `rgba(${c[0]},${c[1]},${c[2]},${(c[3] ?? 255) / 255})`;
const N_TOTAL = 3222;

let OZ = null, OZ_ON = false, OZ_C = null;

// ---------- optional visitor / short-term-rental inputs (produced by other pipelines; every one may be missing)
// Each loads with .catch → null; a missing file just hides its metrics, layers and card lines.
let STR = null, AIR = null, ECON = null, EVT = null;
let AIRPORTS = [], VENUES = [], AIR_ON = false, VEN_ON = false, HOLIDAYS = [];
const getJSON = u => fetch(u).then(r => (r.ok ? r.json() : null)).catch(() => null);
const pick = (o, ...ks) => { if (!o || typeof o !== "object") return undefined; for (const k of ks) if (o[k] != null && o[k] !== "") return o[k]; return undefined; };
const num = v => (v == null || v === "" || !isFinite(+v) ? undefined : +v);
// counties may arrive as {fips: {...}}, [{fips, ...}] or {cols, rows}; normalise to a Map keyed by 5-digit FIPS
function countyMap(src) {
  const m = new Map(); if (!src) return m;
  const put = (f, o) => { if (f != null && o && typeof o === "object") m.set(String(f).padStart(5, "0"), o); };
  if (Array.isArray(src)) src.forEach(o => put(pick(o, "fips", "geoid", "f"), o));
  else if (Array.isArray(src.cols) && Array.isArray(src.rows)) src.rows.forEach(a => { const o = Object.fromEntries(src.cols.map((c, i) => [c, a[i]])); put(pick(o, "fips", "geoid", "f"), o); });
  else if (typeof src === "object") for (const [f, o] of Object.entries(src)) put(f, o);
  return m;
}
const points = arr => (Array.isArray(arr) ? arr : []).map(p => {
  if (!p || typeof p !== "object") return null;
  const lon = num(pick(p, "lon", "lng", "longitude", "x")), lat = num(pick(p, "lat", "latitude", "y"));
  return lon == null || lat == null ? null : { ...p, lon, lat };
}).filter(Boolean);
const compact = v => v == null ? "—" : Math.abs(v) >= 1e9 ? (v / 1e9).toFixed(1) + "B" : Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.abs(v) >= 1e4 ? Math.round(v / 1e3) + "k" : Math.round(v).toLocaleString();
const pct = v => v == null ? "—" : (v <= 1 ? v * 100 : v).toFixed(v <= 1 && v * 100 < 10 ? 2 : 1) + "%";
const sgnPct = v => v == null ? "—" : (v > 0 ? "+" : "") + (Math.abs(v) <= 1 ? v * 100 : v).toFixed(1) + "%";
let JOBS = null, ROAD = null, VIS = null, SITES = [], SITE_ON = false, VIS_STATE = new Map(), VIS_CITIES = [];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const monthName = m => (typeof m === "number" || /^\d+$/.test(m)) ? (MON[+m - 1] || String(m)) : String(m).slice(0, 3);
const listText = v => v == null ? undefined : Array.isArray(v) ? v.map(x => typeof x === "object" ? (pick(x, "name", "label", "h", "hour") ?? JSON.stringify(x)) : x).join(", ") : typeof v === "object" ? Object.entries(v).map(([a, b]) => `${a} ${b}`).join(", ") : String(v);
const hoursText = v => v == null ? undefined : Array.isArray(v) ? v.map(h => typeof h === "number" ? String(h).padStart(2, "0") + ":00" : (typeof h === "object" ? listText([h]) : h)).join(", ") : String(v);
const OPT_METRICS = [
  { src: "str", k: "str_demand", label: "STR demand (visitor flow)", unit: "", fmt: v => v.toFixed(1), note: "Short-term-rental demand index built from public visitor-flow signals (air passengers, lodging, attractions, events). Higher = more visitors. Aggregate public data; no booking or occupancy data." },
  { src: "str", k: "str_score", label: "STR investment score", unit: "", fmt: v => v.toFixed(1), note: "Demand balanced against entry cost (home prices) and known local rules. A screening index, not an underwriting model; no booking or occupancy data." },
  { src: "str", k: "str_cost", label: "Entry cost (cheaper = higher)", unit: "", fmt: v => v.toFixed(1), note: "Entry-cost index from public home values: a higher score means it is cheaper to buy in." },
  { src: "str", k: "str_housing", label: "Housing demand score (buy/rent)", unit: "", fmt: v => v.toFixed(1), note: "Housing demand score (buy and rent) from public population, jobs and housing data. Higher = stronger demand." },
  { src: "jobs", k: "emp_yoy", label: "Job growth (1 yr)", unit: "", fmt: v => sgnPct(v), note: "Year-over-year change in county employment (public BLS / Census series)." },
  { src: "jobs", k: "net_mig", label: "Net domestic in-migration", unit: "", fmt: v => (v > 0 ? "+" : "") + Math.round(v).toLocaleString(), note: "People moving in from other US counties minus people moving out (public Census / IRS migration data)." },
  { src: "jobs", k: "inflow_ratio", label: "Commuter inflow ratio", unit: "", fmt: v => v.toFixed(2), note: "Workers commuting in per worker living in the county (public Census LEHD flows). Above 1 = a job hub." },
  { src: "jobs", k: "hd_pressure", label: "Housing demand pressure", unit: "", fmt: v => v.toFixed(1), note: "Jobs and population growth relative to housing supply. Higher = more pressure on homes." },
  { src: "road", k: "vmt_daily", label: "Road traffic (daily vehicle-miles)", unit: "", fmt: v => compact(v), note: "Daily vehicle-miles travelled on county roads (public FHWA / state DOT traffic counts)." },
  { src: "vis", k: "fed_visits", label: "Visits to federal lands & parks", unit: "", fmt: v => compact(v), note: "Recreation visits to national parks, forests and other federal lands in the county (public NPS / USFS / BLM visitor counts)." },
  { src: "vis", k: "border_12m", label: "Border crossings (12 mo)", unit: "", fmt: v => compact(v), note: "Inbound crossings at land ports of entry in the county over the last 12 months (public BTS border-crossing data)." },
  { src: "vis", k: "cruise_pax", label: "Cruise passengers", unit: "", fmt: v => compact(v), note: "Cruise passengers through ports in the county (latest public port statistics)." },
  { src: "air", k: "air60", label: "Air visitors within 60 km (12 mo)", unit: "", fmt: v => compact(v), note: "Passengers at commercial airports within 60 km of the county over the last 12 months (public airport traffic statistics)." },
  { src: "econ", k: "lodging_share", label: "Tourism intensity (lodging jobs share)", unit: "", fmt: v => pct(v), note: "Accommodation jobs as a share of all county employment (public County Business Patterns / QCEW-style counts)." },
  { src: "wx", k: "dust_days_yr", label: "Dust storm days / yr", unit: "", fmt: v => v.toFixed(1), note: "Average days a year with a dust storm or blowing dust in the county (NOAA Storm Events / NWS, public domain). Dust coats pools, windows and solar panels." },
  { src: "wx", k: "dust_then_rain_yr", label: "Dust-then-rain days / yr", unit: "", fmt: v => v.toFixed(1), note: "Days a year when rain follows a dust day within ~48 h — the mud-spotting events that drive window and pool cleaning calls (public NOAA data)." },
  { src: "wx", k: "high_wind_days_yr", label: "High wind days / yr", unit: "", fmt: v => v.toFixed(1), note: "Average days a year with high or damaging wind reports in the county (NOAA SPC / Storm Events, public domain)." },
  { src: "clean", k: "svc_per_10k_households", label: "Pool service businesses per 10k households", unit: "", fmt: v => v.toFixed(1), note: "Pool-cleaning and related service establishments (employer + nonemployer) per 10,000 households — Census County Business Patterns / Nonemployer Statistics, public domain." },

async function main() {
  const need = u => fetch(u).then(r => { if (!r.ok) throw new Error(u + " " + r.status); return u.endsWith(".bin") ? r.arrayBuffer() : r.json(); });
  const [tbl, meta, st] = await Promise.all(["data/counties.json", "data/earth/dots_meta.json", "data/states.geojson"].map(need));
  META = meta;
  $("boot").textContent = `SAMPLING THE PLANET · ${(meta.world.count + meta.usa.count).toLocaleString()} DOTS…`;
  const [wbuf, ubuf] = await Promise.all(["data/earth/" + meta.world.file, "data/earth/" + meta.usa.file].map(need));
  ROWS = tbl.rows.map(a => Object.fromEntries(tbl.cols.map((c, i) => [c, a[i]])));
  OZ_C = await getJSON("data/oz_counties.json");
  if (OZ_C) ROWS.forEach(r => { const z = OZ_C.counties[r.fips]; r.oz18_share = z?.r2018 ? z.r2018.share : 0; r.oz18_n = z?.r2018?.n || 0; r.oz27_share = z?.r2027 ? z.r2027.share : 0; r.oz27_n = z?.r2027?.n || 0; r.oz27_rural = z?.r2027?.rural || 0; });
  ROWS.forEach(r => { COUNTY.set(r.fips, r); if (r.STATE_NAME) STATE_NAMES.set(r.STUSPS, r.STATE_NAME); });
  WD = decodeDots(wbuf, meta.world); UD = decodeDots(ubuf, meta.usa);
  // per-county / per-state boxes from the dots themselves (antimeridian-safe)
  const byC = new Map();
  for (let i = 0; i < UD.n; i++) { const c = UD.county[i]; let a = byC.get(c); if (!a) byC.set(c, a = { x: [], y: [] }); a.x.push(UD.lng[i]); a.y.push(UD.lt[i]); }
  const byS = new Map();
  for (const [ci, a] of byC) { const f = META.counties[ci], r = COUNTY.get(f); CO_BBOX.set(f, wrapBox(a.x, a.y)); if (r) { let s = byS.get(r.STUSPS); if (!s) byS.set(r.STUSPS, s = { x: [], y: [] }); for (let i = 0; i < a.x.length; i += 3) { s.x.push(a.x[i]); s.y.push(a.y[i]); } } }
  for (const [s, a] of byS) STATE_BBOX.set(s, wrapBox(a.x, a.y));
  EPTI = []; for (let i = 0; i < UD.n; i++) if (UD.flags[i] & 1) EPTI.push(i); EPTI = Uint32Array.from(EPTI);
  st.features.forEach(f => { const g = f.geometry, polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates; polys.forEach(p => p.forEach(ring => STATE_PATHS.push(ring))); });
  for (let lon = -180; lon < 180; lon += 15) { const p = []; for (let lat = -88; lat <= 88; lat += 2) p.push([lon, lat]); GRATICULE.push(p); }
  for (let lat = -75; lat <= 75; lat += 15) { const p = []; for (let lon = -180; lon <= 180; lon += 2) p.push([lon, lat]); GRATICULE.push(p); }

  // metric picker: elevation, county metrics (same list and merge as index.html), tract metrics
  const sel = $("metric");
  const fillMetrics = () => { const v = sel.value || "c0"; sel.innerHTML = `<option value="e">Elevation · NOAA ETOPO 2022</option><optgroup label="County">${METRICS.map((m, i) => `<option value="c${i}">${esc(m.label)}</option>`).join("")}</optgroup><optgroup label="Census tract (loads per state)">${TR_METRICS.map((m, i) => `<option value="t${i}">${esc(m.label)}</option>`).join("")}</optgroup>`;
  sel.value = v; };
  fillMetrics();
  sel.onchange = () => { const v = sel.value;
    if (v === "e") MODE = { kind: "e" };
    else if (v[0] === "c") { MODE = { kind: "c" }; metric = METRICS[+v.slice(1)]; computeBreaks(); }
    else { MODE = { kind: "t" }; TRM = TR_METRICS[+v.slice(1)]; computeTrBreaks(); const r = selected && COUNTY.get(selected); loadTracts(r ? r.STUSPS : stateAt(VS.longitude, VS.latitude)); }
    renderLegend2(); renderCard(); recolorDirty = true; };
  computeBreaks();

  // time
  astro(TIME);
  setTime(new Date());
  $("now").onclick = () => { LIVE = true; setTime(new Date()); };
  const fromInputs = () => { const [y, mo, d] = ($("day").value || TIME.toISOString().slice(0, 10)).split("-").map(Number), m = +$("tod").value; LIVE = false; setTime(new Date(Date.UTC(y, mo - 1, d, Math.floor(m / 60), m % 60)), "slider"); };
  $("tod").oninput = fromInputs; $("day").onchange = fromInputs;

  // toggles (reset to the defaults: browsers restore checkbox state on reload without a change event)
  [["reliefOn", true], ["sunOn", true], ["eptOn", true], ["statesOn", true], ["ozOn", false], ["texOn", false], ["spinOn", false], ["pinsOn", true]].forEach(([id, v]) => { $(id).checked = v; });
  const tog = (id, fn) => { $(id).onchange = e => fn(e.target.checked); };
  tog("reliefOn", v => { RELIEF = v; checkLift(true); });
  tog("sunOn", v => { SUN_ON = v; recolorDirty = true; if (TEX_ON) compose(); });
  tog("eptOn", v => { EPT_ON = v; renderLegend2(); layersDirty = true; });
  tog("statesOn", v => { STATES_ON = v; layersDirty = true; });
  tog("spinOn", v => { SPIN = v; });
  tog("pinsOn", v => { PINS_ON = v; layersDirty = true; });
  tog("texOn", async v => { TEX_ON = v; if (v && !DAY) { $("status").textContent = "loading NASA Blue Marble + Black Marble…"; await loadTex(); $("status").textContent = "NASA Blue Marble (July 2004) by day · Black Marble (2016) by night"; } if (v) compose(); skyDirty = true; layersDirty = true; });
  tog("ozOn", async v => { OZ_ON = v;
    if (v && !OZ) { $("status").textContent = "Loading 15,340 Opportunity Zone tracts…";
      const g = await fetch("data/oz_tracts.geojson").then(r => r.json());
      OZ = { f18: { type: "FeatureCollection", features: g.features.filter(f => f.properties.r === "2018") }, f27: { type: "FeatureCollection", features: g.features.filter(f => f.properties.r === "2027") } };
      $("status").textContent = `${OZ.f18.features.length.toLocaleString()} zones (2018 round) · ${OZ.f27.features.length.toLocaleString()} zones (2027 round) · Treasury / CDFI Fund, public domain`; }
    layersDirty = true; });

  // stars (IAU-named, J2000 RA/Dec) and optional inputs
  const sj = await getJSON("data/stars.json");
  if (sj && Array.isArray(sj.rows)) { const fi = n => sj.fields.indexOf(n); STARS = sj.rows.map(r => [r[fi("ra")], r[fi("dec")], r[fi("mag")], r[fi("bv")], r[fi("hip")], r[fi("name")]]); }

  recolor(); checkLift(true); renderLegend2();
  deckgl2 = deckgl = new deck.Deck({
    parent: $("globe"), views: GLOBE_VIEW, pickingRadius: 8, viewState: VS, controller: { doubleClickZoom: true, inertia: 300 },
    onViewStateChange: ({ viewState, interactionState }) => {
      const user = interactionState && (interactionState.isDragging || interactionState.isPanning || interactionState.isZooming || interactionState.isRotating);
      if (!user && performance.now() - SWITCH_AT < 800) return;   // a new view/controller echoes its stale state right after a globe <-> map switch
      if (interactionState && (interactionState.isDragging || interactionState.isPanning || interactionState.isZooming || interactionState.isRotating)) FLY = null;
      dragging = !!(interactionState && interactionState.isDragging);
      VS = { longitude: viewState.longitude, latitude: viewState.latitude, zoom: viewState.zoom, pitch: viewState.pitch || 0, bearing: viewState.bearing || 0, minZoom: 0, maxZoom: 18 }; if (VIEW_MODE === "globe") VS.pitch = VS.bearing = 0;
      applyVS();
    },
    layers: [], getTooltip: tooltip,
    getCursor: ({ isHovering, isDragging }) => isHovering ? "pointer" : isDragging ? "grabbing" : "grab",
    onLoad: () => {
      // measure pixels per degree on this globe so fly-to boxes fit the screen
      const vp = deckgl2.getViewports()[0];
      if (vp) { const a = vp.project([VS.longitude, VS.latitude - 1, 0]), b = vp.project([VS.longitude, VS.latitude + 1, 0]); const ppd = Math.hypot(a[0] - b[0], a[1] - b[1]) / 2; if (ppd > 0) PPD_K = ppd / 2 ** VS.zoom; }
      const f0 = fitView([-168, 18.5, -64.5, 71.5], 4); VS = { ...VS, ...f0, latitude: f0.latitude + 5, zoom: f0.zoom - 0.25 }; applyVS();
    },
  });
  $("boot").hidden = true;
  $("status").textContent = `${(META.world.count + META.usa.count).toLocaleString()} real elevation dots · click a US dot for its county`;
  $("foot").innerHTML = `Dots: NOAA NCEI ETOPO 2022 (CC0) · night lights NASA Black Marble 2016 · stars IAU WGSN · Storms ${esc(tbl.meta.storm_window[0])} → ${esc(tbl.meta.storm_window[1])} · NOAA SPC · FEMA NRI · USGS 3DEP · Census ACS — public domain · texture NASA Blue Marble NG`;

  $("card").addEventListener("click", e => { const x = e.target.closest(".redact"); if (x) { x.classList.remove("redact"); x.removeAttribute("title"); } });
  const q = $("q");
  q.oninput = () => { resIdx = -1; showResults(); };
  q.onkeydown = e => { const res = $("results")._res || [];
    if (e.key === "ArrowDown") { resIdx = Math.min(res.length - 1, resIdx + 1); showResults(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { resIdx = Math.max(0, resIdx - 1); showResults(); e.preventDefault(); }
    else if (e.key === "Enter") { const r = search(q.value); if (r.length) pickResult(r[Math.max(0, resIdx)]); }
    else if (e.key === "Escape") $("results").hidden = true; };
  $("results").onclick = e => { const b = e.target.closest("button[data-i]"); if (b) pickResult($("results")._res[+b.dataset.i]); };
  document.addEventListener("click", e => { if (!e.target.closest(".srch")) $("results").hidden = true; });
  addEventListener("resize", () => { skyDirty = true; });
  requestAnimationFrame(frame);

  // optional inputs (same files and merge as index.html): add their metrics and card sections once loaded
  [STR, AIR, ECON, EVT, JOBS, ROAD, VIS, WX, CLEAN] = await Promise.all(["data/str_score.json", "data/tourism_air.json", "data/tourism_econ.json", "data/tourism_events.json", "data/jobs_flow.json", "data/road_traffic.json", "data/visitors.json", "data/weather_triggers.json", "data/cleaning_market.json"].map(getJSON));
  mergeOptional(); fillMetrics(); if (selected) renderCard();
  // lazy extras: tract index, county outlines, block pins
  TR_INDEX = await getJSON("data/tracts/index.json");
  getJSON("data/counties.geojson").then(g => { if (g) { GEO = g; g.features.forEach(f => FEAT.set(f.properties.f, f)); selOutline(); } });
  const arr = await getJSON("blocks/index.json");
  if (Array.isArray(arr)) {
    BLOCKS = arr.filter(b => b && b.slug && isFinite(b.lon) && isFinite(b.lat));
    BLOCKS.forEach(b => { b.fips = String(b.fips || "").padStart(5, "0"); BLOCK_BY_FIPS.set(b.fips, b);
      let bi = -1, bd = Infinity; for (let i = 0; i < UD.n; i++) { const d = (UD.lng[i] - b.lon) ** 2 + (UD.lt[i] - b.lat) ** 2; if (d < bd) { bd = d; bi = i; } }
      b._el = bi >= 0 ? Math.max(0, UD.elev[bi]) : 0; b._zBase = b._el; });
    if (BLOCKS.length) $("navView").href = "view.html?block=" + encodeURIComponent(BLOCKS[0].slug);
    renderCard(); layersDirty = true;
  }
  await loadMetroList(); renderLegend2();
}
// ---------- themes: recolour in place
T.mountPicker($("themePick"));
T.on(() => {
  const r = document.documentElement.style;
  r.setProperty("--sel", css(T.rgb("select"))); r.setProperty("--pin", css(T.rgb("pin")));
  if (!WD) return;
  LUT_TH = null; renderLegend2(); renderCard(); recolorDirty = true; skyDirty = true; recolorBlocks(); if (TEX_ON) compose();
});
main().catch(e => { $("boot").textContent = "DATA LOAD FAILED · " + e.message; console.error(e); });

</script>
