<!doctype html>
<!-- Old LiDAR explorer (?lat=&lon=&r=<metres>&area=&block=): opens the app there; zoom from r (r=1000 m -> z 15, each halving of r adds 1).
     The World Maintenance globe app (app/index.html) replaced this page. The original lives in archive/legacy-pages/lidar-index.html (LiDAR explorer).
     URL scheme: app/index.html?lat=&lon=&z=&pitch=&bearing=&block=<slug>&house=<id>&area=county:<fips>|place:<geoid> -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Maintenance</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="1; url=../app/index.html?lat=39.5&lon=-98.35&z=4">
<link rel="canonical" href="../app/index.html?lat=39.5&lon=-98.35&z=4">
<script>
(function () {
  var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ""));
  function get(k) { return q.get(k) || h.get(k); }
  function num(k) { var v = parseFloat(get(k)); return isFinite(v) ? v : null; }
  var out = new URLSearchParams();
  function set(k, v) { if (v !== null && v !== undefined && v !== "") out.set(k, String(v)); }
  var lat = num("lat"), lon = num("lon"), r = num("r");
  var a = get("area"), c = get("county"), p = get("place");
  if (a && /^(county|place):\d{5,7}$/.test(a)) set("area", a);
  else if (c && /^\d{5}$/.test(c)) set("area", "county:" + c);
  else if (p && /^\d{7}$/.test(p)) set("area", "place:" + p);
  var b = get("block"); if (b && /^[\w.-]+$/.test(b)) set("block", b);
  if (lat !== null && lon !== null) {
    var z = num("z") !== null ? num("z") : 15 - Math.log2((r && r > 0 ? r : 1000) / 1000);
    set("lat", lat); set("lon", lon); set("z", Math.round(Math.min(20, Math.max(2, z)) * 10) / 10);
  } else if (!out.has("area") && !out.has("block")) { set("lat", 39.5); set("lon", -98.35); set("z", 4); }
  ["pitch", "bearing"].forEach(function (k) { if (!out.has(k) && num(k) !== null) set(k, num(k)); });
  var th = get("theme"); if (th && /^[\w-]+$/.test(th)) set("theme", th);
  location.replace("../app/index.html?" + out.toString());
})();
</script>
<style>body { background: #05070b; color: #cfd8e3; font: 15px system-ui, sans-serif; margin: 0; padding: 40px 16px; } a { color: #7fd4ff; }</style>
<noscript><p>This page moved into the World Maintenance globe. <a href="../app/index.html?lat=39.5&lon=-98.35&z=4">Open the globe</a>.</p></noscript>
